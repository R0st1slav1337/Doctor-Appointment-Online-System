<nav class="app-nav" aria-label="Main navigation">
  <a class="brand" routerLink="/" aria-label="Clinic home">
    <span class="brand-mark">+</span>
    <span>ClinicCare</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" routerLink="/">Doctors</a>
    <a class="nav-link" routerLink="/free-slots">Free Slots</a>
  </div>
  @if (auth.isLoggedIn()) {
    <div class="nav-actions">
      <a class="nav-link" routerLink="/me">Profile</a>
    <!-- Links are shown by role for convenience only. The real protection is on the server (role_required). -->
    @if (auth.role() === 'admin') {
        <a class="nav-link" routerLink="/admin/doctors">Manage doctors</a>
    }
    @if (auth.role() === 'admin' || auth.role() === 'manager') {
        <a class="nav-link" routerLink="/reports">Reports</a>
    }
      <span class="user">{{ auth.email() }} <span class="role">{{ auth.role() }}</span></span>
      <button class="nav-button" type="button" (click)="logout()">Log out</button>
    </div>
  } @else {
    <div class="nav-actions">
      <a class="nav-link" routerLink="/login">Log in</a>
      <a class="nav-button" routerLink="/register">Register</a>
    </div>
  }
</nav>
<router-outlet />
